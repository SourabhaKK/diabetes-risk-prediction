repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Same check as the lint job in .github/workflows/ci.yml
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (errors only)
        entry: ruff check --select E9,F63,F7,F82 .
        language: system
        pass_filenames: false
        types: [python]

  # Keeps saved notebook outputs (results, data previews) out of git
  - repo: https://github.com/kynan/nbstripout
    rev: 34071b78c181af3bf5af955c1426466e096fc3db  # 0.9.1
    hooks:
      - id: nbstripout
